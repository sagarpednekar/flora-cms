name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Clone repo if first time, otherwise pull
            if [ ! -d "/home/ubuntu/flora-cms" ]; then
              git clone https://github.com/${{ github.repository }}.git /home/ubuntu/flora-cms
            fi

            cd /home/ubuntu/flora-cms
            git pull origin main

            cd backend
            pnpm install --frozen-lockfile
            pnpm exec prisma generate

            # Write .env
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "PORT=4000" >> .env
            echo "CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}" >> .env
            echo "NODE_ENV=development" >> .env

            # Run migrations (safe to run every deploy)
            pnpm exec prisma migrate deploy

            # Build TypeScript
            pnpm build

            # Load env vars into shell so PM2 inherits them, then restart
            set -a && source .env && set +a
            pm2 delete flora-backend 2>/dev/null || true
            pm2 start dist/server.js --name flora-backend
            pm2 save