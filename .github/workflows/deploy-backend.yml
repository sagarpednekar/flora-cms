name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          JWT_SEC: ${{ secrets.JWT_SECRET }}
          CORS: ${{ secrets.CORS_ORIGIN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_URL,JWT_SEC,CORS
          script: |
            if [ ! -d "/home/ubuntu/flora-cms" ]; then
              git clone https://github.com/${{ github.repository }}.git /home/ubuntu/flora-cms
            fi

            cd /home/ubuntu/flora-cms
            git pull origin main

            cd backend
            pnpm install --frozen-lockfile
            pnpm exec prisma generate

            # Create .env BEFORE building if environment variables are needed
            echo "DATABASE_URL=$DB_URL" > .env
            echo "JWT_SECRET=$JWT_SEC" >> .env
            echo "PORT=4000" >> .env
            echo "CORS_ORIGIN=$CORS" >> .env
            echo "NODE_ENV=development" >> .env

            # Verify build succeeds
            pnpm build

            pnpm exec prisma migrate deploy

            set -a && source .env && set +a
            pm2 delete flora-backend 2>/dev/null || true
            pm2 start dist/server.js --name flora-backend
            pm2 save
